services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qa_platform
      POSTGRES_PASSWORD: "admin@123"
      POSTGRES_DB: qa_platform
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    env_file: [../../.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://qa_platform:admin%40123@postgres:5432/qa_platform
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
    depends_on: [postgres, redis, minio]
    ports: ["8000:8000"]

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    env_file: [../../.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://qa_platform:admin%40123@postgres:5432/qa_platform
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
    depends_on: [postgres, redis, minio]

volumes:
  pgdata:
  minio-data:

# MVP scope only (Section 34) — no k8s, no multi-tenant isolation, no parallel
# worker sharding here. That's Production scope (Section 35) — see deploy/k8s/.
